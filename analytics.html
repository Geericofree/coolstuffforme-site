<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Analytics — Guido Rico</title>
<style>
  :root {
    --bg: #0e0e0f;
    --text: #eaeaea;
    --muted: #8f8f8f;
    --accent: #d4d4d4;
    --border: #262626;
    --hover-bg: rgba(255, 255, 255, 0.04);
    --hover-border: #3a3a3a;
    --surface: #1a1a19;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --good: #0ca30c;
    --critical: #e66767;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f7f7;
      --text: #171717;
      --muted: #5f5f5f;
      --accent: #1f1f1f;
      --border: #dcdcdc;
      --hover-bg: rgba(0, 0, 0, 0.035);
      --hover-border: #b8b8b8;
      --surface: #fcfcfb;
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --series-3: #1baf7a;
      --good: #006300;
      --critical: #e34948;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 3rem 1.25rem 4rem;
  }
  main {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }
  a.back {
    display: inline-block;
    margin-bottom: 1.5rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.88rem;
  }
  a.back:hover { color: var(--text); }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 0.35rem;
  }
  p.sub {
    color: var(--muted);
    font-size: 0.88rem;
    margin: 0 0 2rem;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    background: var(--surface);
  }

  /* --- gate --- */
  #gate { max-width: 360px; }
  #gate label {
    display: block;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  #gate .gate-row { display: flex; gap: 0.5rem; }
  #gate input[type="password"] {
    flex: 1;
    padding: 0.6rem 0.7rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 0.9rem;
  }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    padding: 0.6rem 1rem;
    font-size: 0.85rem;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  button:hover { background: var(--hover-bg); border-color: var(--hover-border); }
  button.primary { border-color: var(--series-1); color: var(--series-1); }
  #gate-error {
    color: var(--critical);
    font-size: 0.82rem;
    margin-top: 0.75rem;
    min-height: 1.2em;
  }

  /* --- dashboard --- */
  #dashboard { display: none; }
  #dashboard.is-loading .fade { opacity: 0.45; transition: opacity 0.2s ease; }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }
  .range-group { display: flex; gap: 0.4rem; }
  .range-group button.is-active { border-color: var(--series-1); color: var(--series-1); }
  .toolbar .spacer { flex: 1; }
  #status-note { color: var(--muted); font-size: 0.8rem; margin-bottom: 1.5rem; min-height: 1.2em; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 0.9rem;
    margin-bottom: 1.75rem;
  }
  .stat-value {
    font-size: 1.6rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat-label {
    color: var(--muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 0.3rem;
  }

  .panel { margin-bottom: 1.75rem; }
  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.9rem;
  }
  .panel-head h2 {
    font-size: 0.8rem;
    font-weight: 600;
    margin: 0;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .legend { display: flex; gap: 0.9rem; font-size: 0.78rem; color: var(--muted); }
  .legend-item { display: flex; align-items: center; gap: 0.35rem; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  #trend-svg-wrap { position: relative; }
  #trend-svg { width: 100%; height: 220px; display: block; overflow: visible; }
  #trend-svg rect.bar { cursor: pointer; }
  #trend-svg rect.bar:hover, #trend-svg rect.bar:focus { opacity: 0.8; outline: none; }
  #trend-table { display: none; }

  #tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.65rem;
    font-size: 0.78rem;
    line-height: 1.5;
    z-index: 10;
    display: none;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  }
  #tooltip .t-title { font-weight: 600; margin-bottom: 0.15rem; }
  #tooltip .t-row { display: flex; align-items: center; gap: 0.4rem; }
  #tooltip .t-key { width: 10px; height: 2px; display: inline-block; }
  #tooltip .t-num { font-variant-numeric: tabular-nums; font-weight: 600; }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.data-table th, table.data-table td {
    text-align: left;
    padding: 0.5rem 0.4rem;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  table.data-table th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }

  .bar-list { display: flex; flex-direction: column; gap: 0.55rem; }
  .bar-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 3.5rem;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.85rem;
  }
  .bar-row .bar-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-track {
    grid-column: 1 / -1;
    height: 8px;
    border-radius: 4px;
    background: var(--border);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--series-1);
  }
  .bar-row .bar-count {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .empty-note { color: var(--muted); font-size: 0.85rem; }
  #load-error {
    color: var(--critical);
    font-size: 0.85rem;
    margin-bottom: 1.5rem;
    display: none;
  }
  footer {
    margin-top: 2.5rem;
    font-size: 0.78rem;
    color: var(--muted);
    opacity: 0.7;
  }
</style>
</head>
<body>
  <main>
    <a class="back" href="index.html">&larr; Back</a>
    <h1>Analytics</h1>
    <p class="sub">Traffic on coolstuffforme.net, from Cloudflare Web Analytics.</p>

    <section id="gate" class="card">
      <label for="gate-key">Dashboard key</label>
      <div class="gate-row">
        <input type="password" id="gate-key" autocomplete="current-password" placeholder="Enter key">
        <button type="button" class="primary" id="gate-unlock">Unlock</button>
      </div>
      <p id="gate-error"></p>
    </section>

    <div id="load-error" role="alert"></div>

    <section id="dashboard">
      <div class="toolbar">
        <div class="range-group" id="range-group">
          <button type="button" data-days="7">7d</button>
          <button type="button" data-days="30">30d</button>
          <button type="button" data-days="90">90d</button>
        </div>
        <div class="spacer"></div>
        <button type="button" id="lock-btn">Lock</button>
      </div>
      <p id="status-note"></p>

      <div class="stats fade" id="stats"></div>

      <section class="panel fade">
        <div class="panel-head">
          <h2>Visits &amp; pageviews per day</h2>
          <div style="display:flex; align-items:center; gap:1rem;">
            <div class="legend">
              <span class="legend-item"><span class="legend-swatch" style="background:var(--series-1)"></span>Visits</span>
              <span class="legend-item"><span class="legend-swatch" style="background:var(--series-2)"></span>Pageviews</span>
            </div>
            <button type="button" id="table-toggle">View as table</button>
          </div>
        </div>
        <div class="card" id="trend-svg-wrap">
          <svg id="trend-svg" role="img" aria-label="Visits and pageviews per day"></svg>
          <table class="data-table" id="trend-table">
            <thead><tr><th>Date</th><th>Visits</th><th>Pageviews</th></tr></thead>
            <tbody id="trend-table-body"></tbody>
          </table>
        </div>
      </section>

      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem;">
        <section class="panel fade">
          <div class="panel-head"><h2>Top pages</h2></div>
          <div class="card bar-list" id="panel-paths"></div>
        </section>
        <section class="panel fade">
          <div class="panel-head"><h2>Top referrers</h2></div>
          <div class="card bar-list" id="panel-referers"></div>
        </section>
        <section class="panel fade">
          <div class="panel-head"><h2>Top countries</h2></div>
          <div class="card bar-list" id="panel-countries"></div>
        </section>
        <section class="panel fade">
          <div class="panel-head"><h2>By device</h2></div>
          <div class="card bar-list" id="panel-devices"></div>
        </section>
      </div>
    </section>

    <footer>&copy; 2026 Guido Rico</footer>
  </main>

  <div id="tooltip"></div>

  <script src="js/analytics.js"></script>
</body>
</html>
