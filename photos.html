<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos — Guido Rico</title>
<style>
  :root {
    --bg: #000000;
    --text: #eafff0;
    --muted: #7fbf8f;
    --accent: #39ff14;
    --border: #1f3d24;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 3rem 1.5rem 5rem;
  }
  #matrix-rain {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    display: block;
  }
  main {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin: 0 0 0.4rem;
    text-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 2.5rem;
  }
  a.back {
    display: inline-block;
    margin-bottom: 2rem;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.5rem 1.2rem;
  }
  a.back:hover {
    background: rgba(57, 255, 20, 0.12);
    border-color: var(--accent);
  }
  .cluster {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }
  .blob {
    position: relative;
    width: 220px;
    height: 220px;
    margin: -18px;
    overflow: hidden;
    border: 2px solid var(--accent);
    box-shadow: 0 0 18px rgba(57, 255, 20, 0.3);
    background: #000;
  }
  .blob img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .b1  { border-radius: 42% 58% 63% 37% / 47% 41% 59% 53%; transform: rotate(-4deg) translateY(6px); }
  .b2  { border-radius: 63% 37% 54% 46% / 42% 60% 40% 58%; transform: rotate(6deg) translateY(-10px); width: 190px; height: 190px; }
  .b3  { border-radius: 38% 62% 45% 55% / 60% 48% 52% 40%; transform: rotate(-8deg) translateY(14px); width: 240px; height: 240px; }
  .b4  { border-radius: 55% 45% 38% 62% / 45% 55% 62% 38%; transform: rotate(5deg) translateY(-4px); width: 200px; height: 200px; }
  .b5  { border-radius: 48% 52% 60% 40% / 38% 55% 45% 62%; transform: rotate(-6deg) translateY(10px); }
  .b6  { border-radius: 60% 40% 48% 52% / 55% 45% 38% 62%; transform: rotate(9deg) translateY(-8px); width: 210px; height: 210px; }
  .b7  { border-radius: 45% 55% 40% 60% / 62% 38% 55% 45%; transform: rotate(-3deg) translateY(8px); width: 230px; height: 230px; }
  .b8  { border-radius: 52% 48% 58% 42% / 40% 62% 45% 55%; transform: rotate(7deg) translateY(-12px); width: 195px; height: 195px; }
  .b9  { border-radius: 40% 60% 50% 50% / 55% 45% 60% 40%; transform: rotate(-9deg) translateY(4px); width: 215px; height: 215px; }
  .b10 { border-radius: 58% 42% 45% 55% / 48% 58% 40% 62%; transform: rotate(4deg) translateY(-6px); width: 200px; height: 200px; }
  .b11 { border-radius: 46% 54% 62% 38% / 50% 44% 56% 50%; transform: rotate(-5deg) translateY(10px); width: 225px; height: 225px; }
  .blob:hover {
    z-index: 5;
    box-shadow: 0 0 28px rgba(57, 255, 20, 0.55);
  }
  footer {
    margin-top: 3rem;
    font-size: 0.8rem;
    color: #4a7a55;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>
  <canvas id="matrix-rain"></canvas>
  <main>
    <a class="back" href="index.html">&larr; Back</a>
    <h1>Photos</h1>
    <p class="sub">A little cluster of moments.</p>
    <div class="cluster">
      <div class="blob b1"><img src="photos/photo01.jpg" alt="Photo 1"></div>
      <div class="blob b2"><img src="photos/photo02.jpg" alt="Photo 2"></div>
      <div class="blob b3"><img src="photos/photo03.jpg" alt="Photo 3"></div>
      <div class="blob b4"><img src="photos/photo04.jpg" alt="Photo 4"></div>
      <div class="blob b5"><img src="photos/photo05.jpg" alt="Photo 5"></div>
      <div class="blob b6"><img src="photos/photo06.jpg" alt="Photo 6"></div>
      <div class="blob b7"><img src="photos/photo07.jpg" alt="Photo 7"></div>
      <div class="blob b8"><img src="photos/photo08.jpg" alt="Photo 8"></div>
      <div class="blob b9"><img src="photos/photo09.jpg" alt="Photo 9"></div>
      <div class="blob b10"><img src="photos/photo10.jpg" alt="Photo 10"></div>
      <div class="blob b11"><img src="photos/photo11.jpg" alt="Photo 11"></div>
      <div class="blob b1"><img src="photos/photo12.jpg" alt="Photo 12"></div>
      <div class="blob b2"><img src="photos/photo13.jpg" alt="Photo 13"></div>
      <div class="blob b3"><img src="photos/photo14.jpg" alt="Photo 14"></div>
      <div class="blob b4"><img src="photos/photo15.jpg" alt="Photo 15"></div>
      <div class="blob b5"><img src="photos/photo16.jpg" alt="Photo 16"></div>
      <div class="blob b6"><img src="photos/photo17.jpg" alt="Photo 17"></div>
      <div class="blob b7"><img src="photos/photo18.jpg" alt="Photo 18"></div>
      <div class="blob b8"><img src="photos/photo19.jpg" alt="Photo 19"></div>
      <div class="blob b9"><img src="photos/photo20.jpg" alt="Photo 20"></div>
      <div class="blob b10"><img src="photos/photo21.jpg" alt="Photo 21"></div>
    </div>
  </main>
  <footer>&copy; 2026 Guido Rico</footer>

  <script>
    (function () {
      var canvas = document.getElementById('matrix-rain');
      var ctx = canvas.getContext('2d');
      var chars = '$01アイウエオカキクケコサシスセソタチツテト{}();=<>100'.split('');
      var fontSize = 16;
      var columns, drops;

      function size() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        columns = Math.floor(canvas.width / fontSize);
        drops = new Array(columns).fill(1);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      size();
      window.addEventListener('resize', size);

      function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + 'px monospace';
        for (var i = 0; i < columns; i++) {
          var text = chars[Math.floor(Math.random() * chars.length)];
          var x = i * fontSize;
          var y = drops[i] * fontSize;
          ctx.fillStyle = Math.random() > 0.93 ? '#c6ffcf' : '#39ff14';
          ctx.fillText(text, x, y);
          if (y > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }
      setInterval(draw, 45);
    })();
  </script>
</body>
</html>
