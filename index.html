<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guido Rico</title>
<style>
  :root {
    --bg: #000000;
    --text: #eafff0;
    --muted: #7fbf8f;
    --accent: #39ff14;
    --border: #1f3d24;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 4rem 2rem;
  }
  #matrix-rain {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    display: block;
  }
  main {
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 0 1.25rem;
    border: 1px solid var(--accent);
    box-shadow: 0 0 16px rgba(57, 255, 20, 0.35);
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 600;
    margin: 0 0 0.5rem;
    letter-spacing: -0.02em;
    text-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
  }
  p.bio {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
    margin: 0 0 2rem;
  }
  .contact {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    align-items: center;
  }
  a.contact-link {
    color: var(--text);
    text-decoration: none;
    font-size: 0.95rem;
    padding: 0.6rem 1.4rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(2px);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  a.contact-link:hover {
    background: rgba(57, 255, 20, 0.12);
    border-color: var(--accent);
  }
  .dog {
    margin-top: 3rem;
  }
  .dog h2 {
    font-size: 1rem;
    font-weight: 600;
    margin: 0 0 1rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .dog img {
    width: 100%;
    max-width: 100%;
    border-radius: 12px;
    border: 1px solid var(--accent);
    box-shadow: 0 0 16px rgba(57, 255, 20, 0.25);
  }
  .dog blockquote {
    margin: 1rem 0 0;
    font-style: italic;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .dog cite {
    display: block;
    margin-top: 0.4rem;
    font-style: normal;
    font-size: 0.85rem;
    color: var(--accent);
  }
  .comments {
    margin-top: 3rem;
    text-align: left;
  }
  .comments h2 {
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    margin: 0 0 1rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .visits {
    margin-top: 2rem;
    display: flex;
    justify-content: center;
  }
  footer {
    margin-top: 2rem;
    font-size: 0.8rem;
    color: #4a7a55;
  }
  #music-toggle {
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    z-index: 2;
    background: rgba(0, 0, 0, 0.7);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 0.6rem 1.1rem;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(57, 255, 20, 0.3);
  }
  #music-toggle:hover {
    background: rgba(57, 255, 20, 0.15);
  }
</style>
</head>
<body>
  <canvas id="matrix-rain"></canvas>
  <main>
    <img class="avatar" src="avatar.jpg" alt="Guido Rico">
    <h1>Guido Rico</h1>
    <p class="bio">Working at the intersection of finance and technology.</p>
    <div class="contact">
      <a class="contact-link" href="mailto:guidorico@icloud.com">guidorico@icloud.com</a>
      <a class="contact-link" href="https://www.linkedin.com/in/gricomndz/" target="_blank" rel="noopener">LinkedIn</a>
      <a class="contact-link" href="sms:+525543401033">SMS: +52 55 4340 1033</a>
      <a class="contact-link" href="https://wa.me/525543401033" target="_blank" rel="noopener">WhatsApp: +52 55 4340 1033</a>
      <a class="contact-link" href="https://etoro.tw/3RIu6vW" target="_blank" rel="noopener sponsored">Happy investing!</a>
    </div>
    <section class="dog">
      <h2>Meet the dog</h2>
      <img src="dog.jpg" alt="Guido's dog">
      <blockquote>"The more I learn about people, the more I like my dog."<cite>&mdash; Mark Twain</cite></blockquote>
    </section>

    <section class="comments">
      <h2>Comments</h2>
      <script src="https://utteranc.es/client.js"
        repo="Geericofree/coolstuffforme-site"
        issue-term="pathname"
        label="Comment"
        theme="github-dark-orange"
        crossorigin="anonymous"
        async>
      </script>
    </section>

    <div class="visits">
      <img src="https://visitor-badge.laobi.icu/badge?page_id=coolstuffforme.net" alt="visitor count" />
    </div>

    <footer>&copy; 2026 Guido Rico</footer>
  </main>

  <button id="music-toggle" type="button">&#9658; Play Music</button>
  <iframe id="yt-audio" title="Background music" style="position:absolute;width:0;height:0;border:0;" allow="autoplay"></iframe>

  <script>
    (function () {
      var canvas = document.getElementById('matrix-rain');
      var ctx = canvas.getContext('2d');
      var chars = '$01アイウエオカキクケコサシスセソタチツテト{}();=<>100'.split('');
      var fontSize = 16;
      var columns, drops;

      function size() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        columns = Math.floor(canvas.width / fontSize);
        drops = new Array(columns).fill(1);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      size();
      window.addEventListener('resize', size);

      function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + 'px monospace';
        for (var i = 0; i < columns; i++) {
          var text = chars[Math.floor(Math.random() * chars.length)];
          var x = i * fontSize;
          var y = drops[i] * fontSize;
          ctx.fillStyle = Math.random() > 0.93 ? '#c6ffcf' : '#39ff14';
          ctx.fillText(text, x, y);
          if (y > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }
      setInterval(draw, 45);
    })();
  </script>

  <script>
    (function () {
      var btn = document.getElementById('music-toggle');
      var frame = document.getElementById('yt-audio');
      var playing = false;
      var src = 'https://www.youtube.com/embed/m3stLwd1CnQ?list=RDm3stLwd1CnQ&autoplay=1&playsinline=1';
      btn.addEventListener('click', function () {
        if (!playing) {
          frame.src = src;
          btn.innerHTML = '&#10074;&#10074; Pause Music';
        } else {
          frame.src = '';
          btn.innerHTML = '&#9658; Play Music';
        }
        playing = !playing;
      });
    })();
  </script>
</body>
</html>
