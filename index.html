<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guido Rico</title>
<style>
  :root {
    --bg: #fafafa;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #1a1a1a;
    --border: #e5e5e5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  main {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 600;
    margin: 0 0 0.5rem;
    letter-spacing: -0.02em;
  }
  p.bio {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
    margin: 0 0 2rem;
  }
  .contact {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    align-items: center;
  }
  a.contact-link {
    color: var(--text);
    text-decoration: none;
    font-size: 0.95rem;
    padding: 0.6rem 1.4rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  a.contact-link:hover {
    background: #f0f0f0;
    border-color: #d0d0d0;
  }
  footer {
    margin-top: 3rem;
    font-size: 0.8rem;
    color: #b0b0b0;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --border: #2a2a2a;
    }
    a.contact-link:hover {
      background: #1c1c1c;
      border-color: #3a3a3a;
    }
  }
</style>
</head>
<body>
  <main>
    <h1>Guido Rico</h1>
    <p class="bio">Working at the intersection of finance and technology.</p>
    <div class="contact">
      <a class="contact-link" href="mailto:guidorico@icloud.com">guidorico@icloud.com</a>
      <a class="contact-link" href="https://www.linkedin.com/in/gricomndz/" target="_blank" rel="noopener">LinkedIn</a>
      <a class="contact-link" href="sms:+525543401033">SMS: +52 55 4340 1033</a>
      <a class="contact-link" href="https://wa.me/525543401033" target="_blank" rel="noopener">WhatsApp: +52 55 4340 1033</a>
    </div>
    <footer>&copy; 2026 Guido Rico</footer>
  </main>
</body>
</html>
