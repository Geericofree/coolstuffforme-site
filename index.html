  }

    gap: 0.75rem;
    align-items: center;
  }

    text-decoration: none;
    font-size: 0.95rem;
    padding: 0.6rem 1.4rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  a.contact-link:hover {
    background: #f0f0f0;
    border-color: #d0d0d0;
  }

    margin-top: 3rem;
    text-align: left;
  }

    font-weight: 600;
    text-align: center;

    color: var(--muted);
    text-transform: uppercase;

    display: flex;
    justify-content: center;
  }

    font-size: 0.8rem;
